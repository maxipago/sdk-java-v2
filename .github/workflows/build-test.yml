name: Build-n-Test
on:
  push:
    branches:
      - 'feature/**'
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'redhat'
    - name: Run the Maven Verify and Test phase
      run: |
        mvn --batch-mode --update-snapshots verify
        mvn test
